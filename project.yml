name: PinHere
options:
  bundleIdPrefix: com.vishnuchandramc
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

packages:
  PinHereKit:
    path: Packages/PinHereKit

targets:
  # ---------------------------------------------------------------- iPhone
  PinHere:
    type: application
    platform: iOS
    sources: [App/iOS]
    dependencies:
      - package: PinHereKit
      - target: PinHereWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).pinhere
        PRODUCT_NAME: Pin Here
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: App/iOS/PinHere.entitlements
    info:
      path: App/iOS/Info.plist
      properties:
        CFBundleDisplayName: Pin Here
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [remote-notification]
        NSLocationWhenInUseUsageDescription: To save where you're standing.
        NSLocationAlwaysAndWhenInUseUsageDescription: To tap you when you're back, even with the app closed and your phone at home.
        NSMicrophoneUsageDescription: To turn what you say into the note.
        NSSpeechRecognitionUsageDescription: To turn what you say into the note.
        NSCameraUsageDescription: To attach a photo to this pin.
        PinHereAppGroup: $(APP_GROUP_ID)
        PinHereICloudContainer: $(ICLOUD_CONTAINER_ID)

  # ---------------------------------------------------------------- Watch app (sole return detector)
  PinHereWatch:
    type: application
    platform: watchOS
    sources: [App/Watch]
    dependencies:
      - package: PinHereKit
      - target: PinHereWatchWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).pinhere.watchkitapp
        PRODUCT_NAME: Pin Here
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: App/Watch/PinHereWatch.entitlements
        SKIP_INSTALL: YES
    info:
      path: App/Watch/Info.plist
      properties:
        CFBundleDisplayName: Pin Here
        WKApplication: true
        WKCompanionAppBundleIdentifier: $(BUNDLE_ID_PREFIX).pinhere
        WKRunsIndependentlyOfCompanionApp: false
        # Week-one prototype: verify whether watch-side condition monitoring needs this.
        WKBackgroundModes: [location]
        NSLocationWhenInUseUsageDescription: To save where you're standing.
        NSLocationAlwaysAndWhenInUseUsageDescription: To tap you when you're back, even with your phone at home.
        PinHereAppGroup: $(APP_GROUP_ID)
        PinHereICloudContainer: $(ICLOUD_CONTAINER_ID)

  # ---------------------------------------------------------------- Watch complication / Smart Stack
  PinHereWatchWidget:
    type: app-extension
    platform: watchOS
    sources: [App/WatchWidget]
    dependencies:
      - package: PinHereKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).pinhere.watchkitapp.widget
        PRODUCT_NAME: PinHereWatchWidget
        CODE_SIGN_ENTITLEMENTS: App/WatchWidget/PinHereWatchWidget.entitlements
        SKIP_INSTALL: YES
    info:
      path: App/WatchWidget/Info.plist
      properties:
        CFBundleDisplayName: Pin Here
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

schemes:
  PinHere:
    build:
      targets:
        PinHere: all
        PinHereWatch: all
    run:
      config: Debug
  PinHereWatch:
    build:
      targets:
        PinHereWatch: all
    run:
      config: Debug
